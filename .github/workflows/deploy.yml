name: Build & deploy website

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# Only the deploy step needs write access, but the job pushes to the gh-pages
# branch so the whole job requires it. Pull requests from forks get a read-only
# token and skip the deploy step anyway.
permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        # VuePress 1.x uses webpack 4, which relies on hashing algorithms that
        # OpenSSL 3 only exposes through the legacy provider.
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run build

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Custom domain + skip Jekyll processing of the generated assets.
          echo 'keel.sh' > dist/CNAME
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
